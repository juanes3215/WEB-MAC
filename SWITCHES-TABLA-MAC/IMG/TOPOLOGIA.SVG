<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Topología de un switch con cuatro equipos conectados</title>
  <desc id="d2">Diagrama que muestra un switch conectado a cuatro computadoras y la tabla de direcciones MAC que construye</desc>

  <rect width="800" height="450" fill="#ffffff"/>

  <!-- switch central -->
  <rect x="330" y="180" width="140" height="60" rx="8" fill="#0077cc"/>
  <text x="400" y="215" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" fill="#ffffff" font-weight="600">SWITCH</text>

  <!-- 4 PCs -->
  <g font-family="Roboto, sans-serif" font-size="12" fill="#333333">
    <!-- PC1 -->
    <rect x="60" y="60" width="70" height="46" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
    <text x="95" y="88" text-anchor="middle">PC1</text>
    <text x="95" y="122" text-anchor="middle" font-size="11">AA:11:22:33:44:01</text>
    <line x1="130" y1="83" x2="330" y2="195" stroke="#2ecc71" stroke-width="2"/>

    <!-- PC2 -->
    <rect x="60" y="350" width="70" height="46" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
    <text x="95" y="378" text-anchor="middle">PC2</text>
    <text x="95" y="412" text-anchor="middle" font-size="11">AA:11:22:33:44:02</text>
    <line x1="130" y1="373" x2="330" y2="225" stroke="#2ecc71" stroke-width="2"/>

    <!-- PC3 -->
    <rect x="670" y="60" width="70" height="46" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
    <text x="705" y="88" text-anchor="middle">PC3</text>
    <text x="705" y="122" text-anchor="middle" font-size="11">AA:11:22:33:44:03</text>
    <line x1="670" y1="83" x2="470" y2="195" stroke="#2ecc71" stroke-width="2"/>

    <!-- PC4 -->
    <rect x="670" y="350" width="70" height="46" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
    <text x="705" y="378" text-anchor="middle">PC4</text>
    <text x="705" y="412" text-anchor="middle" font-size="11">AA:11:22:33:44:04</text>
    <line x1="670" y1="373" x2="470" y2="225" stroke="#2ecc71" stroke-width="2"/>
  </g>

  <!-- tabla MAC -->
  <g font-family="Roboto, sans-serif" font-size="12">
    <rect x="290" y="270" width="220" height="130" fill="#f5f5f5" stroke="#0077cc" stroke-width="1.5" rx="4"/>
    <text x="400" y="290" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" fill="#0077cc">Tabla MAC (CAM)</text>
    <line x1="290" y1="298" x2="510" y2="298" stroke="#0077cc" stroke-width="1"/>
    <text x="300" y="315" fill="#333333" font-weight="600">Puerto</text>
    <text x="380" y="315" fill="#333333" font-weight="600">Dirección MAC</text>
    <text x="300" y="335" fill="#333333">Fa0/1</text>
    <text x="380" y="335" fill="#333333">...44:01</text>
    <text x="300" y="352" fill="#333333">Fa0/2</text>
    <text x="380" y="352" fill="#333333">...44:02</text>
    <text x="300" y="369" fill="#333333">Fa0/3</text>
    <text x="380" y="369" fill="#333333">...44:03</text>
    <text x="300" y="386" fill="#333333">Fa0/4</text>
    <text x="380" y="386" fill="#333333">...44:04</text>
  </g>
</svg>